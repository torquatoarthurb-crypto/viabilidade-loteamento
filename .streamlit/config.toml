[theme]
base = "light"
primaryColor = "#B07D2E"
backgroundColor = "#F5F3EE"
secondaryBackgroundColor = "#ECEAE4"
textColor = "#1A1916"
font = "sans serif"

[server]
headless = true
runOnSave = false
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
